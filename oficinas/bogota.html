<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bogotá 101 | JAS Booking</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#1f2733;font-family:"Segoe UI",Arial,sans-serif}.app{--az:#0b2d5b;--az2:#1d4f91;--verde:#1f9d55;--rojo:#c0392b;--gris:#f3f5f8;--borde:#d9dee7;width:min(1440px,96vw);margin:auto;padding:16px}.head{display:flex;justify-content:space-between;background:var(--az);color:#fff;border-radius:12px;padding:18px 22px}.head h1{margin:0;font-size:1.55rem}.head p{margin:4px 0 0;color:#c9d6ea}.status{border-radius:20px;background:#1f9d55;padding:5px 10px;font-size:.75rem;height:max-content}.tools{display:grid;grid-template-columns:1fr 190px 100px;gap:12px;margin:14px 0;padding:14px;background:var(--gris);border-radius:12px}.field label{display:block;color:#5d6b80;font-size:.78rem;margin-bottom:4px}.field input,.btn{height:39px;width:100%;border:1px solid var(--borde);border-radius:8px;padding:0 10px}.btn{background:var(--az2);color:#fff;border:0;font-weight:700;cursor:pointer}.verify{grid-column:1/-1;background:white;color:var(--az);border:1px solid var(--borde)}.stats{display:flex;gap:28px;align-items:center;margin:14px 0}.stats strong{font-size:1.35rem;color:var(--az);display:block}.stats span{font-size:.77rem;color:#5d6b80}.legend{margin-left:auto;font-size:.76rem}.legend i{display:inline-block;width:11px;height:11px;margin:0 4px 0 12px;border-radius:2px}.freeDot{border:1px solid var(--verde);background:#e8f6ee}.busyDot{border:1px solid var(--rojo);background:#fdecea}.mapWrap{overflow:auto;border:1px solid var(--borde);border-radius:12px;background:white}.map{position:relative;min-width:900px}.map img{display:block;width:100%;height:auto}.desk{position:absolute;transform:translate(-50%,-50%);width:4.3%;height:4.3%;min-width:31px;border:1px solid var(--verde);border-radius:5px;background:#e8f6ee;font-weight:800;cursor:pointer;opacity:.94}.desk.busy{border-color:var(--rojo);background:#fdecea;color:#9d251b}.desk.fixed{border-color:#777;background:#e5e7eb;color:#555;cursor:not-allowed}.desk:hover:not(.fixed){transform:translate(-50%,-50%) scale(1.12);z-index:5}.section{color:var(--az);font-size:1rem;margin:18px 0 8px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:7px}.booking{display:flex;justify-content:space-between;align-items:center;background:var(--gris);border-radius:8px;padding:9px 11px;font-size:.84rem}.cancel{border:0;border-radius:6px;background:#c0392b;color:white;padding:6px 9px;cursor:pointer}.empty{color:#68778b;font-size:.86rem}.modal{position:fixed;inset:0;background:#0a142866;display:grid;place-items:center;padding:16px;z-index:20}.modal[hidden]{display:none}.box{width:min(410px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 10px 40px #0004}.box h3{margin:0;color:var(--az)}.box p{color:#5d6b80}.actions{display:flex;justify-content:flex-end;gap:8px}.secondary{background:white;color:var(--az);border:1px solid var(--borde)}.toast{position:fixed;right:20px;bottom:20px;background:var(--az);color:#fff;border-radius:9px;padding:12px 15px;z-index:30}.toast.error{background:var(--rojo)}.toast[hidden]{display:none}@media(max-width:700px){.tools{grid-template-columns:1fr}.verify{grid-column:1}.legend{margin-left:0}.stats{flex-wrap:wrap}}
</style></head><body><main class="app"><header class="head"><div><h1>Reserva de puestos y salas</h1><p>JAS Colombia · Bogotá 101 · disponibilidad compartida en Supabase</p></div><span class="status" id="status">Conectando...</span></header><section class="tools"><div class="field"><label>Buscar puesto</label><input id="search" placeholder="Ej.: 24"></div><div class="field"><label>Fecha</label><input id="date" type="date"></div><button class="btn" id="go">Buscar</button><button class="btn verify" id="refresh">↻ Verificar disponibilidad</button></section><section class="stats"><div><strong id="free">0</strong><span>Puestos libres</span></div><div><strong id="busy">0</strong><span>Puestos reservados</span></div><div class="legend"><i class="freeDot"></i>Libre <i class="busyDot"></i>Reservado</div></section><h2 class="section">Plano de la oficina</h2><div class="mapWrap"><div class="map" id="map"><img src="../floorplan-bogota.jpg" alt="Plano Bogotá 101"></div></div><h2 class="section">Mis reservas del día</h2><div class="list" id="list"></div><p class="empty" id="updated"></p></main><div class="modal" id="modal" hidden><div class="box"><h3 id="modalTitle">Reservar puesto</h3><p id="modalText"></p><div class="actions"><button class="btn secondary" id="close">Cancelar</button><button class="btn" id="confirm">Confirmar reserva</button></div></div></div><div class="toast" id="toast" hidden></div>
<script>
const sb=window.supabase.createClient('https://vaivheftorfpildxnvow.supabase.co','sb_publishable_l3j36iY3TrgcfwSxMTJlLQ_A4X8hzop');
const W=1536,H=1024,coords={};function row(nums,xs,y){nums.forEach((n,k)=>coords[n]=[xs[k]/W*100,y/H*100])}row([1,2,3],[418,489,560],130);row([6,5,4],[418,489,560],174);let x4=[333,406,477,548];row([7,8,9,10],x4,302);row([14,13,12,11],x4,347);row([15,16,17,18],x4,473);row([22,21,20,19],x4,518);let x5=[273,344,413,482,553];row([23,24,25,26,27],x5,653);row([32,31,30,29,28],x5,699);let x6=[205,274,345,414,483,554];row([33,34,35,36,37,38],x6,836);row([44,43,42,41,40,39],x6,884);[45,46,47,48].forEach((n,k)=>coords[n]=[951/W*100,[106,150,195,239][k]/H*100]);[49,50,51,52].forEach((n,k)=>coords[n]=[1019/W*100,[106,150,195,239][k]/H*100]);let x5b=[1158,1227,1296,1369,1443];row([53,54,55,56,57],x5b,106);row([62,61,60,59,58],x5b,150);let x7=[1078,1142,1204,1263,1323,1382,1442];row([63,64,65,66,67,68,69],x7,311);row([76,75,74,73,72,71,70],x7,355);
const fixed={33:'RH',39:'IT',44:'RH'};let profile=null,availability=[],selected=null;const $=id=>document.getElementById(id);function toast(t,e=false){$('toast').textContent=t;$('toast').className='toast'+(e?' error':'');$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,5000)}function today(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
async function init(){let session=null;for(let attempt=0;attempt<12;attempt++){const result=await sb.auth.getSession();session=result.data.session;if(session)break;await new Promise(r=>setTimeout(r,250));}if(!session){$('status').textContent='Sesión no disponible';toast('No se pudo acceder a la sesión dentro del módulo Bogotá. Vuelve a la página principal e inicia sesión nuevamente.',true);$('go').disabled=true;$('refresh').disabled=true;return;}const {data:rows,error}=await sb.rpc('get_my_profile');profile=Array.isArray(rows)?rows[0]:rows;if(error||!profile){$('status').textContent='Perfil no disponible';toast('No se pudo identificar el perfil autenticado.',true);return;}$('status').textContent='Conectado · '+profile.full_name;$('date').value=today();draw();await load()}
function draw(){for(let n=1;n<=76;n++){let b=document.createElement('button');b.className='desk'+(fixed[n]?' fixed':'');b.dataset.n=n;b.textContent=n;b.style.left=coords[n][0]+'%';b.style.top=coords[n][1]+'%';b.title=fixed[n]?'Puesto fijo '+fixed[n]:'Puesto '+n;b.onclick=()=>openDesk(n);$('map').appendChild(b)}}
async function load(){let date=$('date').value;const {data,error}=await sb.rpc('get_desk_availability',{p_office_code:'BOG101',p_date:date});if(error)return toast(error.message,true);availability=data||[];let map=new Map(availability.map(x=>[Number(x.space_code.replace('DESK-','')),x]));let free=0,busy=0;document.querySelectorAll('.desk').forEach(b=>{let n=Number(b.dataset.n),a=map.get(n);b.dataset.space=a?.space_id||'';b.classList.toggle('busy',!!a&&!a.is_available&&!fixed[n]);if(a&&a.is_available&&!fixed[n])free++;else if(!fixed[n])busy++});$('free').textContent=free;$('busy').textContent=busy;await loadMine();$('updated').textContent='Última actualización: '+new Date().toLocaleTimeString('es-CO')}
async function loadMine(){const {data,error}=await sb.from('bookings').select('id,booking_date,status,space_id,spaces(name,code)').eq('booking_date',$('date').value).eq('status','active').order('id');if(error)return toast(error.message,true);$('list').innerHTML='';if(!data?.length){$('list').innerHTML='<p class="empty">No tienes reservas de puesto para esta fecha.</p>';return}data.forEach(r=>{let d=document.createElement('div');d.className='booking';d.innerHTML='<span><b>'+r.spaces.name+'</b> · '+r.booking_date+'</span>';let c=document.createElement('button');c.className='cancel';c.textContent='Cancelar';c.onclick=()=>cancelBooking(r.id);d.appendChild(c);$('list').appendChild(d)})}
function openDesk(n){if(fixed[n])return;let a=availability.find(x=>Number(x.space_code.replace('DESK-',''))===n);if(!a)return;if(!a.is_available)return toast('Este puesto ya está reservado para la fecha seleccionada.',true);selected=a;$('modalTitle').textContent='Reservar puesto '+n;$('modalText').textContent='Fecha: '+$('date').value+' · Bogotá 101';$('modal').hidden=false}
async function reserve(){if(!selected)return;$('confirm').disabled=true;const {error}=await sb.from('bookings').insert({profile_id:profile.id,space_id:selected.space_id,booking_date:$('date').value,status:'active'});$('confirm').disabled=false;if(error){toast(error.message,true)}else{toast('Reserva confirmada.');$('modal').hidden=true;await load()}}
async function cancelBooking(id){if(!confirm('¿Cancelar esta reserva?'))return;const {error}=await sb.from('bookings').update({status:'cancelled',cancelled_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message,true);else{toast('Reserva cancelada.');await load()}}
$('close').onclick=()=>$('modal').hidden=true;$('confirm').onclick=reserve;$('go').onclick=load;$('refresh').onclick=load;$('date').onchange=load;$('search').oninput=e=>{let q=e.target.value.trim();document.querySelectorAll('.desk').forEach(b=>b.style.opacity=!q||b.dataset.n.includes(q)?'1':'.18')};init();setInterval(load,30000);
</script></body></html>
