<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAS Workspace | Reservas Colombia</title>
<style>
:root{--nav:#082b59;--blue:#174f90;--bg:#edf2f7;--white:#fff;--line:#d7e0eb;--text:#172033}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
body{display:grid;grid-template-rows:auto 1fr}.shell{background:var(--nav);color:#fff;padding:14px 18px;box-shadow:0 3px 14px #0002;z-index:2}
.top{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.mark{font-size:1.55rem;font-weight:800;letter-spacing:.04em}.brand small{display:block;color:#b9c9df}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #ffffff55;background:#ffffff12;color:#fff;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}.tab:hover,.tab.active{background:#fff;color:var(--nav)}
.notice{max-width:1320px;margin:10px auto 0;background:#fff2c7;color:#694c00;border-radius:8px;padding:8px 11px;font-size:.82rem}.stage{min-height:0;padding:12px}iframe{display:block;width:100%;height:100%;min-height:760px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 8px 25px #0b2d5b12}
@media(max-width:650px){.shell{padding:12px}.top{align-items:flex-start}.tabs{width:100%}.tab{flex:1;padding:9px 7px}.stage{padding:6px}iframe{border-radius:9px;min-height:700px}}
</style>
</head>
<body>
<header class="shell">
  <div class="top">
    <div class="brand"><div class="mark">JAS</div><div><strong>Workspace Colombia</strong><small>Reserva de puestos, salas y Phonebooks</small></div></div>
    <nav class="tabs" aria-label="Seleccionar oficina">
      <button class="tab active" data-office="bogota" type="button">Bogotá 101</button>
      <button class="tab" data-office="medellin" type="button">Medellín</button>
      <button class="tab" data-office="aeropuerto" type="button">Aeropuerto</button>
    </nav>
  </div>
  <div class="notice"><strong>Versión unificada de demostración:</strong> las reservas se guardan en este navegador. La conexión definitiva a usuarios y base de datos se realizará con Supabase.</div>
</header>
<main class="stage"><iframe id="app" title="Sistema de reservas JAS" src="oficinas/bogota.html"></iframe></main>
<script>
(function(){
 const routes={bogota:'oficinas/bogota.html',medellin:'oficinas/medellin.html',aeropuerto:'oficinas/aeropuerto.html'};
 const frame=document.getElementById('app');
 const tabs=[...document.querySelectorAll('.tab')];
 function openOffice(key,push){
   if(!routes[key]) key='bogota';
   frame.src=routes[key];
   tabs.forEach(b=>b.classList.toggle('active',b.dataset.office===key));
   if(push) history.replaceState(null,'','#'+key);
   document.title='JAS Workspace | '+({bogota:'Bogotá 101',medellin:'Medellín',aeropuerto:'Aeropuerto'}[key]);
 }
 tabs.forEach(b=>b.addEventListener('click',()=>openOffice(b.dataset.office,true)));
 openOffice(location.hash.slice(1)||'bogota',false);
 window.addEventListener('hashchange',()=>openOffice(location.hash.slice(1),false));
})();
</script>
</body>
</html>
