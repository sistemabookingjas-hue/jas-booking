<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAS Workspace | Reservas Colombia</title>
<style>
:root{--nav:#082b59;--bg:#edf2f7;--line:#d7e0eb;--text:#172033}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}body{display:grid;grid-template-rows:auto 1fr}.shell{background:var(--nav);color:#fff;padding:14px 18px;box-shadow:0 3px 14px #0002;z-index:2}.top{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.mark{font-size:1.55rem;font-weight:800}.brand small{display:block;color:#b9c9df}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{border:1px solid #ffffff55;background:#ffffff12;color:#fff;padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}.tab:hover,.tab.active{background:#fff;color:var(--nav)}.notice{max-width:1320px;margin:10px auto 0;background:#fff2c7;color:#694c00;border-radius:8px;padding:8px 11px;font-size:.82rem}.stage{min-height:0;padding:12px}iframe{display:block;width:100%;height:100%;min-height:760px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 8px 25px #0b2d5b12}.authGate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#061f42,#0d427f)}.authGate.hidden{display:none}.authCard{width:min(440px,100%);background:#fff;border-radius:16px;padding:30px;box-shadow:0 24px 70px #0005}.authBrand{display:flex;align-items:center;gap:12px;color:#082b59}.authMark{font-size:28px;font-weight:900;font-style:italic}.authBrand small{display:block;color:#74849a}.authCard h1{margin:26px 0 6px;color:#082b59}.authLead{margin:0 0 20px;color:#66758a;font-size:14px}.authField{margin:13px 0}.authField.hidden{display:none}.authField label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#34445b}.authField input{width:100%;height:44px;border:1px solid #c9d3df;border-radius:8px;padding:0 12px;font-size:14px}.authPrimary{width:100%;height:44px;border:0;border-radius:8px;background:#082b59;color:#fff;font-weight:700;cursor:pointer}.authPrimary:disabled{opacity:.6}.authActions{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.authActions button{border:0;background:none;color:#145fa8;font-weight:600;cursor:pointer}.authMessage{min-height:18px;margin:10px 0;font-size:12px}.authMessage.error{color:#b42318}.authMessage.ok{color:#067647}.sessionBox{display:flex;align-items:center;gap:8px}.logoutBtn{border:1px solid #ffffff55;background:#ffffff12;color:white;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:650}@media(max-width:650px){.shell{padding:12px}.top{align-items:flex-start}.tabs{width:100%}.tab{flex:1;padding:9px 7px}.stage{padding:6px}iframe{border-radius:9px;min-height:700px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authGate" class="authGate"><div class="authCard"><div class="authBrand"><div class="authMark">JAS</div><div><strong>Booking Colombia</strong><small>Acceso corporativo</small></div></div><h1 id="authTitle">Iniciar sesión</h1><p id="authLead" class="authLead">Ingresa con tu correo autorizado y contraseña.</p><div id="nameRow" class="authField hidden"><label>Nombre completo</label><input id="authName" autocomplete="name"></div><div class="authField"><label>Correo</label><input id="authEmail" type="email" autocomplete="email" placeholder="nombre@jas.com"></div><div class="authField"><label>Contraseña</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Mínimo 8 caracteres"></div><div id="confirmRow" class="authField hidden"><label>Confirmar contraseña</label><input id="authConfirm" type="password" autocomplete="new-password"></div><div id="authMessage" class="authMessage"></div><button id="authPrimary" class="authPrimary" type="button">Iniciar sesión</button><div class="authActions"><button id="toggleSignup" type="button">Crear cuenta</button><button id="forgotPassword" type="button">¿Olvidaste tu contraseña?</button></div></div></div>
<header class="shell"><div class="top"><div class="brand"><div class="mark">JAS</div><div><strong>Workspace Colombia</strong><small>Reserva de puestos, salas y Phonebooks</small></div></div><div class="sessionBox"><span id="currentUser"></span><button id="logoutBtn" class="logoutBtn" type="button">Cerrar sesión</button></div><nav class="tabs"><button class="tab active" data-office="bogota">Bogotá 101</button><button class="tab" data-office="medellin">Medellín</button><button class="tab" data-office="aeropuerto">Aeropuerto</button></nav></div><div class="notice"><strong>Versión de validación:</strong> autenticación conectada a Supabase. Los módulos de oficinas conservan temporalmente su almacenamiento local.</div></header>
<main class="stage"><iframe id="app" title="Sistema de reservas JAS" src="oficinas/bogota.html"></iframe></main>
<script>
const routes={bogota:'oficinas/bogota.html',medellin:'oficinas/medellin.html',aeropuerto:'oficinas/aeropuerto.html'};const frame=document.getElementById('app');const tabs=[...document.querySelectorAll('.tab')];function openOffice(key,push){if(!routes[key])key='bogota';frame.src=routes[key];tabs.forEach(b=>b.classList.toggle('active',b.dataset.office===key));if(push)history.replaceState(null,'','#'+key)}tabs.forEach(b=>b.onclick=()=>openOffice(b.dataset.office,true));openOffice(location.hash.slice(1)||'bogota',false);
const sb=window.supabase.createClient('https://vaivheftorfpildxnvow.supabase.co','sb_publishable_l3j36iY3TrgcfwSxMTJlLQ_A4X8hzop');let authMode='login';const $=id=>document.getElementById(id);function msg(t,c=''){$('authMessage').textContent=t;$('authMessage').className='authMessage '+c}function mode(m){authMode=m;let s=m==='signup';$('authTitle').textContent=s?'Crear cuenta':'Iniciar sesión';$('authLead').textContent=s?'La cuenta debe usar un correo previamente autorizado por JAS Booking.':'Ingresa con tu correo autorizado y contraseña.';$('nameRow').classList.toggle('hidden',!s);$('confirmRow').classList.toggle('hidden',!s);$('authPrimary').textContent=s?'Crear cuenta':'Iniciar sesión';$('toggleSignup').textContent=s?'Ya tengo cuenta':'Crear cuenta';$('forgotPassword').style.display=s?'none':'';msg('')}
async function allowed(email){const {data,error}=await sb.rpc('is_email_authorized',{p_email:email});return !error&&data===true}
async function signup(){let n=$('authName').value.trim(),e=$('authEmail').value.trim().toLowerCase(),p=$('authPassword').value,c=$('authConfirm').value;if(!n||!e||!p||!c)return msg('Completa todos los campos.','error');if(p!==c)return msg('Las contraseñas no coinciden.','error');if(p.length<8)return msg('La contraseña debe tener mínimo 8 caracteres.','error');$('authPrimary').disabled=true;if(!await allowed(e)){$('authPrimary').disabled=false;return msg('Este correo no está autorizado para registrarse.','error')}const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:'https://sistemabookingjas-hue.github.io/jas-booking/'}});$('authPrimary').disabled=false;if(error)return msg(error.message,'error');msg('Cuenta creada. Revisa tu correo para confirmar el registro.','ok')}
async function login(){let e=$('authEmail').value.trim().toLowerCase(),p=$('authPassword').value;if(!e||!p)return msg('Completa correo y contraseña.','error');const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return msg(error.message,'error');await init()}
async function forgot(){let e=$('authEmail').value.trim().toLowerCase();if(!e)return msg('Escribe primero tu correo.','error');const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:'https://sistemabookingjas-hue.github.io/jas-booking/'});if(error)return msg(error.message,'error');msg('Revisa tu correo para recuperar la contraseña.','ok')}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){$('authGate').classList.remove('hidden');return}const {data:profile}=await sb.from('profiles').select('full_name,is_active,is_admin').eq('auth_user_id',session.user.id).maybeSingle();if(!profile||!profile.is_active){await sb.auth.signOut();$('authGate').classList.remove('hidden');return msg('Tu cuenta está confirmada, pero aún no está vinculada al perfil autorizado.','error')}$('currentUser').textContent=profile.full_name+(profile.is_admin?' · Administrador':'');$('authGate').classList.add('hidden')}
$('authPrimary').onclick=()=>authMode==='signup'?signup():login();$('toggleSignup').onclick=()=>mode(authMode==='signup'?'login':'signup');$('forgotPassword').onclick=forgot;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};init();
</script>
</body></html>
